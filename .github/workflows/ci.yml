name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # renovate: datasource=npm packageName=npm
  NPM_VERSION: 10.8.3
  # renovate: datasource=npm packageName=renovate
  RENOVATE_VERSION: 38.80.0

  # renovate: datasource=node-version packageName=node
  NODE_18_VERSION: 18.20.4
  # renovate: datasource=node-version packageName=node
  NODE_20_VERSION: 20.17.0
  # renovate: datasource=node-version packageName=node
  NODE_22_VERSION: 22.9.0


jobs:
  build-node:
    name: Build / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 18, 20, 22 ]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env[format('NODE_{0}_VERSION', matrix.node)] }}
        cache: npm
    - name: Install latest npm
      run: |
        npm install --global npm@${{ env.NPM_VERSION }}
        npm -v
    - name: Install dependencies
      run: npm ci
    - name: Cache turbo
      uses: actions/cache@v4
      with:
        path: ./.turbo/cache
        key: turbo2-cache-build-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo2-cache-build-${{ runner.os }}-
    - name: Run Build
      run: npm run build
      env:
        SKIP_LINT: true

  test-unit:
    name: Test / Unit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install latest npm
      run: |
        npm install --global npm@${{ env.NPM_VERSION }}
        npm -v
    - name: Install dependencies
      run: npm ci
    - name: Cache turbo
      uses: actions/cache@v4
      with:
        path: ./.turbo/cache
        key: turbo2-cache-test-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo2-cache-test-${{ runner.os }}-
    - name: Run Test
      run: npm run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install latest npm
      run: |
        npm install --global npm@${{ env.NPM_VERSION }}
        npm -v
    - name: Install dependencies
      run: npm ci
    - name: Cache turbo
      uses: actions/cache@v4
      with:
        path: ./.turbo/cache
        key: turbo2-cache-lint-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo2-cache-lint-${{ runner.os }}-
    - name: Run Lint
      run: npm run lint

  renovate:
    name: Validate renovate config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install renovate
      run: npm i -g renovate@${{ env.RENOVATE_VERSION }}
    - name: Validate config
      run: renovate-config-validator --strict

  success:
    name: Success
    needs: [test-unit, build-node, lint, renovate]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check job status
      run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Success
      run: exit 0

  publish-npm:
    name: Publish / npm / ${{ matrix.target }}
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    needs: [success]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      matrix:
        target: [ ui, helper, tsconfig, publish-package, eslint-config ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        registry-url: 'https://registry.npmjs.org'
    - name: Install latest npm
      run: |
        npm install --global npm@${{ env.NPM_VERSION }}
        npm -v
    - name: Install dependencies
      run: npm ci
    - name: Run Publish
      run: npm run publish-package -- --filter=@brickninja-org/${{ matrix.target }} --env-mode=loose
      id: publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        NPM_CONFIG_PROVENANCE: false
        GITHUB_EVENT_NAME: ${{ github.event_name }}
    - name: Find Comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/find-comment@v3
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: Publish / npm / ${{ matrix.target }}
    - name: Delete comment if found but nothing will be published
      if: github.event_name == 'pull_request' && steps.fc.outputs.comment-id && !steps.publish.outputs.publish
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.deleteComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            comment_id: ${{ steps.fc.outputs.comment-id }}
          })
    - name: Add comment with packages to be published
      if: github.event_name == 'pull_request' && steps.publish.outputs.publish
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        edit-mode: replace
        body: |
          **Publish / npm / ${{ matrix.target }}**
          Merging this PR will publish the npm package `${{ steps.publish.outputs.publish }}`