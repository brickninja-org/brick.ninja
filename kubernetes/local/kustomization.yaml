apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: brickninja

commonLabels:
  app.kubernetes.io/part-of: brickninja

resources:
- ../base
- next
- database

images:
- name: ghcr.io/brickninja-org/brick.ninja/web
  newTag: latest
  newName: brickninja/web

- name: ghcr.io/brickninja-org/brick.ninja/worker
  newTag: latest
  newName: brickninja/worker

- name: ghcr.io/brickninja-org/brick.ninja/database-migration
  newTag: latest
  newName: brickninja/database-migration